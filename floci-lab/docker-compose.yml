version: '3.8'

services:
  floci-azure:
    image: floci/azure:latest
    container_name: floci-azure-lab
    ports:
      - "10000:10000" # Blob / Storage port
      - "10001:10001" # Queue port
    volumes:
      - ./azure-data:/data
    restart: unless-stopped

  floci-gcp:
    image: floci/gcp:latest
    container_name: floci-gcp-lab
    ports:
      - "8080:8080" # Cloud Storage / Core API port
      - "8085:8085" # Pub/Sub port
    environment:
      - GCP_PROJECT=local-lab-project
    volumes:
      - ./gcp-data:/data
    restart: unless-stopped